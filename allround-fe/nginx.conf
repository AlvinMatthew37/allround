server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy configuration to match Vite's dev server proxy
    location /monkeytype/ {
        proxy_pass https://monkeytype.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host monkeytype.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rewrite logic is handled by the trailing slash in proxy_pass
        # and the location match, effectively stripping /monkeytype/
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
